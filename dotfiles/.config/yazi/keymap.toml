[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Documents/"
desc = "Go to ~/Documents"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/Projects/"
desc = "Go to ~/Projects"

[[mgr.prepend_keymap]]
on = ["g", "y"]
run = "cd ~/ywdsem/"
desc = "Go to ~/ywdsem"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Root of the current Git repository"
